<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当班交接汇总</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js"></script>
    <style>
        body { background-color: #f5f5f5; min-height: 100vh; }
        .navbar-brand-title { font-weight: 700; font-size: 1.2rem; }
        .tag-unsettled { background-color: #ff9f43 !important; }
        .tag-settled { background-color: #48c78e !important; }
        .tag-lost { background-color: #f14668 !important; }
        .tag-normal { background-color: #48c78e !important; }
        .tag-level-high { background-color: #f14668 !important; color: #fff !important; }
        .tag-level-medium { background-color: #ff9f43 !important; color: #fff !important; }
        .tag-level-normal { background-color: #3298dc !important; color: #fff !important; }
        .warning-card { border-left: 4px solid #f14668 !important; }
        .warning-card.is-medium { border-left-color: #ff9f43 !important; }
        .warning-card.is-normal { border-left-color: #3298dc !important; }
        .warning-badge { display: inline-block; min-width: 22px; padding: 0 6px; line-height: 22px; text-align: center; border-radius: 11px; background: #f14668; color: #fff; font-size: 12px; font-weight: bold; margin-left: 4px; }
        .card-table { overflow-x: auto; }
    </style>
</head>
<body style="background-color: #f5f5f5; min-height: 100vh;" x-data="shiftApp()">
<nav class="navbar is-primary" role="navigation">
    <div class="navbar-brand">
        <a class="navbar-item navbar-brand-title" href="/">🛁 澡堂手牌管理系统</a>
    </div>
    <div class="navbar-menu">
        <div class="navbar-start">
            <a class="navbar-item" href="/">首页</a>
            <a class="navbar-item" href="/bath-areas">浴区管理</a>
            <a class="navbar-item" href="/wristbands">手牌配置</a>
            <a class="navbar-item" href="/issue">入场发牌</a>
            <a class="navbar-item" href="/return">退牌结算</a>
            <a class="navbar-item" href="/report-loss">遗失申报</a>
            <a class="navbar-item" href="/reissue-review">补办审核</a>
            <a class="navbar-item" href="/wristband-tracking">手牌追踪</a>
            <a class="navbar-item" href="/warnings">预警中心
                <span class="warning-badge" x-show="warningStats && warningStats.total_unread > 0" x-text="warningStats.total_unread"></span>
            </a>
            <a class="navbar-item" href="/shift-summary">交接汇总</a>
            <a class="navbar-item" href="/store-management">门店管理</a>
            <a class="navbar-item" href="/cross-store-report">清分报表</a>
        </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <span class="mr-3">欢迎，{{user['full_name']}}</span>
                <a class="button is-light" href="/logout">退出登录</a>
            </div>
        </div>
    </div>
</nav>
<section class="section">
    <div class="container">
        <div class="level">
            <div class="level-left">
                <h1 class="title">当班交接汇总</h1>
            </div>
            <div class="level-right">
                <button class="button is-warning is-medium" @click="closeShift()" x-show="shift && shift.status == 'active'">
                    完成交接 / 开始新班次
                </button>
            </div>
        </div>

        <div class="notification is-danger" x-show="!shift">
            <strong>当前没有活跃班次，请重新登录以创建新班次。</strong>
        </div>

        <template x-if="shift">
            <div>
                <div class="box">
                    <div class="level">
                        <div class="level-item has-text-centered">
                            <div>
                                <p class="heading">班次编号</p>
                                <p class="title is-4" x-text="shift.shift_no"></p>
                            </div>
                        </div>
                        <div class="level-item has-text-centered">
                            <div>
                                <p class="heading">开始时间</p>
                                <p class="title is-4"><small x-text="shift.start_time"></small></p>
                            </div>
                        </div>
                        <div class="level-item has-text-centered">
                            <div>
                                <p class="heading">班次状态</p>
                                <p class="tag is-medium" :class="shift.status == 'active' ? 'is-primary' : 'is-grey'" x-text="shift.status == 'active' ? '进行中' : '已交接'"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="columns">
                    <div class="column">
                        <div class="notification is-info">
                            <p class="heading">当班发牌数</p>
                            <p class="title" x-text="summary ? summary.issue_count : 0"></p>
                        </div>
                    </div>
                    <div class="column">
                        <div class="notification is-warning">
                            <p class="heading">遗失补办数</p>
                            <p class="title" x-text="summary ? summary.reissue_count : 0"></p>
                        </div>
                    </div>
                    <div class="column">
                        <div class="notification is-danger">
                            <p class="heading">未结算记录</p>
                            <p class="title" x-text="summary ? summary.unsettled_count : 0"></p>
                        </div>
                    </div>
                    <div class="column">
                        <div class="notification is-success">
                            <p class="heading">已结算收入</p>
                            <p class="title">¥ <span x-text="summary ? parseFloat(summary.total_income).toFixed(2) : '0.00'"></span></p>
                        </div>
                    </div>
                </div>

                <div class="box" style="background: linear-gradient(135deg, #f5f0ff 0%, #e8f4fd 100%); border-color: #667eea;">
                    <div class="level is-mobile mb-3">
                        <div class="level-left"><h2 class="subtitle mb-0">💳 会员联动数据</h2></div>
                        <div class="level-right">
                            <span class="tag is-link is-light" x-show="summary" x-text="'会员发牌 ' + (summary.member_issue_count || 0) + ' 次'"></span>
                        </div>
                    </div>
                    <div class="columns">
                        <div class="column">
                            <div class="notification is-link is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">会员发牌数</p>
                                <p class="is-size-4 has-text-weight-bold has-text-link" x-text="summary ? summary.member_issue_count : 0"></p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="notification is-link is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">会员消费笔数</p>
                                <p class="is-size-4 has-text-weight-bold has-text-link" x-text="summary ? summary.member_consume_count : 0"></p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="notification is-success is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">新注册会员</p>
                                <p class="is-size-4 has-text-weight-bold has-text-success" x-text="summary ? summary.member_new_count : 0"></p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="notification is-success is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">储值充值</p>
                                <p class="is-size-4 has-text-weight-bold has-text-success">¥ <span x-text="summary ? parseFloat(summary.member_top_up_total).toFixed(2) : '0.00'"></span></p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="notification is-info is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">套餐购买</p>
                                <p class="is-size-4 has-text-weight-bold has-text-info" x-text="summary ? summary.member_package_purchase_count : 0"></p>
                            </div>
                        </div>
                    </div>
                    <div class="columns mt-1">
                        <div class="column">
                            <div class="notification is-info is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">套餐核销</p>
                                <p class="is-size-4 has-text-weight-bold has-text-info" x-text="summary ? summary.member_package_verify_count : 0"></p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="notification is-warning is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">余额抵扣</p>
                                <p class="is-size-4 has-text-weight-bold has-text-warning-dark">¥ <span x-text="summary ? parseFloat(summary.member_balance_deduction).toFixed(2) : '0.00'"></span></p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="notification is-primary is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">套餐抵扣</p>
                                <p class="is-size-4 has-text-weight-bold has-text-primary">¥ <span x-text="summary ? parseFloat(summary.member_package_deduction).toFixed(2) : '0.00'"></span></p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="notification is-warning is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">赠送余额使用</p>
                                <p class="is-size-4 has-text-weight-bold has-text-warning-dark">¥ <span x-text="summary ? parseFloat(summary.member_gift_balance_used).toFixed(2) : '0.00'"></span></p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="notification is-danger is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">抵扣合计</p>
                                <p class="is-size-4 has-text-weight-bold has-text-danger">¥ <span x-text="summary ? (parseFloat(summary.member_balance_deduction||0) + parseFloat(summary.member_package_deduction||0) + parseFloat(summary.member_gift_balance_used||0)).toFixed(2) : '0.00'"></span></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="box" style="background: linear-gradient(135deg, #fff5f5 0%, #fffbf0 100%); border-color: #ff6b6b;">
                    <div class="level is-mobile mb-3">
                        <div class="level-left"><h2 class="subtitle mb-0">🏪 跨店清分数据</h2></div>
                        <div class="level-right">
                            <a class="button is-small is-danger is-outlined" href="/cross-store-report">查看清分报表 →</a>
                        </div>
                    </div>
                    <div class="columns">
                        <div class="column">
                            <div class="notification is-link is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">跨店发牌数</p>
                                <p class="is-size-4 has-text-weight-bold has-text-link" x-text="summary ? summary.cross_store_issue_count : 0"></p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="notification is-warning is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">跨店抵扣</p>
                                <p class="is-size-4 has-text-weight-bold has-text-warning-dark">¥ <span x-text="summary ? parseFloat(summary.cross_store_deduction).toFixed(2) : '0.00'"></span></p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="notification is-success is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">跨店收入</p>
                                <p class="is-size-4 has-text-weight-bold has-text-success">¥ <span x-text="summary ? parseFloat(summary.cross_store_income).toFixed(2) : '0.00'"></span></p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="notification is-danger is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">待清算金额</p>
                                <p class="is-size-4 has-text-weight-bold has-text-danger">¥ <span x-text="summary ? parseFloat(summary.pending_clearing_amount).toFixed(2) : '0.00'"></span></p>
                            </div>
                        </div>
                        <div class="column">
                            <div class="notification is-info is-light py-3 px-3 mb-0">
                                <p class="heading is-size-7">总部补贴</p>
                                <p class="is-size-4 has-text-weight-bold has-text-info">¥ <span x-text="summary ? parseFloat(summary.hq_subsidy_amount).toFixed(2) : '0.00'"></span></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="box">
                    <div class="columns is-mobile is-vcentered mb-0">
                        <div class="column">
                            <h2 class="subtitle mb-0">⚠️ 本班次预警信息
                                <span class="warning-badge ml-2" x-show="shiftWarnings.length > 0" x-text="shiftWarnings.length"></span>
                            </h2>
                        </div>
                        <div class="column is-narrow">
                            <a class="button is-small is-info" href="/warnings">进入预警中心</a>
                        </div>
                    </div>

                    <div class="columns mt-3 mb-3">
                        <div class="column is-3">
                            <div class="notification is-danger is-light py-3 px-3 mb-2">
                                <p class="heading is-size-7">🔴 高级未读</p>
                                <p class="is-size-4 has-text-weight-bold has-text-danger" x-text="warningStats.high_count || 0"></p>
                            </div>
                        </div>
                        <div class="column is-3">
                            <div class="notification is-warning is-light py-3 px-3 mb-2">
                                <p class="heading is-size-7">🟠 中级未读</p>
                                <p class="is-size-4 has-text-weight-bold has-text-warning-dark" x-text="warningStats.medium_count || 0"></p>
                            </div>
                        </div>
                        <div class="column is-3">
                            <div class="notification is-info is-light py-3 px-3 mb-2">
                                <p class="heading is-size-7">🔵 一般未读</p>
                                <p class="is-size-4 has-text-weight-bold has-text-info" x-text="warningStats.normal_count || 0"></p>
                            </div>
                        </div>
                        <div class="column is-3">
                            <div class="notification is-dark is-light py-3 px-3 mb-2">
                                <p class="heading is-size-7">⚙️ 待解决</p>
                                <p class="is-size-4 has-text-weight-bold has-text-dark" x-text="warningStats.unresolved_count || 0"></p>
                            </div>
                        </div>
                    </div>

                    <div x-show="shiftWarnings.length > 0" style="max-height:300px;overflow-y:auto;">
                        <template x-for="w in shiftWarnings" :key="w.id">
                            <div class="card warning-card mb-3" :class="'is-' + w.warning_level">
                                <div class="card-content py-3 px-4">
                                    <div class="columns is-mobile is-vcentered mb-0">
                                        <div class="column">
                                            <span class="tag is-small mr-2" :class="'tag-level-' + w.warning_level" x-text="levelText(w.warning_level)"></span>
                                            <span class="tag is-small mr-2" x-text="typeText(w.warning_type)"></span>
                                            <span class="has-text-weight-semibold" x-text="w.title"></span>
                                            <span class="warning-badge ml-2" x-show="!w.is_read">!</span>
                                        </div>
                                        <div class="column is-narrow is-size-7 has-text-grey" x-text="formatTime(w.created_at)"></div>
                                    </div>
                                    <p class="is-size-7 has-text-grey-dark mt-2 mb-1" x-text="w.content"></p>
                                    <div class="is-size-7" x-show="w.wristband_no || w.bath_area_name">
                                        <span class="has-text-grey" x-show="w.wristband_no">手牌: <strong x-text="w.wristband_no"></strong>&nbsp;&nbsp;</span>
                                        <span class="has-text-grey" x-show="w.bath_area_name">浴区: <span x-text="w.bath_area_name"></span>&nbsp;&nbsp;</span>
                                        <span class="has-text-grey" x-show="w.phone">手机: <span x-text="w.phone"></span></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div x-show="shiftWarnings.length == 0" class="has-text-centered has-text-grey py-5">
                        <p class="is-size-5 mb-1">✅ 本班次发牌暂无相关预警</p>
                        <p class="is-size-7">仅统计与本班次发放记录直接关联的预警，全局预警请前往预警中心查看</p>
                    </div>
                    <p class="is-size-7 has-text-grey mt-2 mb-0" x-show="shiftWarnings.length > 0">
                        * 仅展示与本班次发放记录直接关联的预警，全局类预警（如频繁遗失、连续补办等）请前往预警中心查看
                    </p>
                </div>

                <div class="box card-table">
                    <h2 class="subtitle">当班发牌明细</h2>
                    <table class="table is-fullwidth is-striped">
                        <thead>
                            <tr>
                                <th>流水号</th><th>手牌</th><th>顾客</th><th>会员</th><th>电话</th><th>浴区</th>
                                <th>发牌时间</th><th>退牌时间</th><th>费用</th><th>抵扣</th><th>遗失补办</th><th>状态</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="r in records" :key="r.id">
                                <tr>
                                    <td><small x-text="r.serial_no"></small></td>
                                    <td><strong x-text="r.wristband_no"></strong></td>
                                    <td x-text="r.customer_name"></td>
                                    <td>
                                        <span class="tag is-link is-light is-small" x-show="r.member_id" x-text="r.level_name || '会员'"></span>
                                        <span class="tag is-light is-small" x-show="!r.member_id">散客</span>
                                    </td>
                                    <td x-text="r.phone"></td>
                                    <td x-text="r.bath_area_name"></td>
                                    <td><small x-text="r.issue_time"></small></td>
                                    <td><small x-text="r.return_time || '-'"></small></td>
                                    <td>
                                        ¥ <span x-text="(parseFloat(r.base_fee||0)+parseFloat(r.extra_fee||0)+parseFloat(r.loss_fee||0)+parseFloat(r.reissue_fee||0)).toFixed(2)"></span>
                                    </td>
                                    <td>
                                        <span class="is-size-7" x-show="parseFloat(r.package_deduction||0) > 0 || parseFloat(r.balance_deduction||0) > 0">
                                            <span x-show="parseFloat(r.package_deduction||0) > 0" class="tag is-primary is-light is-small">套餐¥<span x-text="parseFloat(r.package_deduction).toFixed(2)"></span></span>
                                            <span x-show="parseFloat(r.balance_deduction||0) > 0" class="tag is-success is-light is-small ml-1">余额¥<span x-text="parseFloat(r.balance_deduction).toFixed(2)"></span></span>
                                        </span>
                                        <span class="is-size-7 has-text-grey" x-show="parseFloat(r.package_deduction||0) == 0 && parseFloat(r.balance_deduction||0) == 0">-</span>
                                    </td>
                                    <td>
                                        <span class="tag" x-show="r.has_reissue" style="background-color:#ff9f43;">是</span>
                                        <span class="tag is-light" x-show="!r.has_reissue">否</span>
                                    </td>
                                    <td>
                                        <span class="tag" :class="'tag-' + r.fee_status" x-text="r.fee_status == 'settled' ? '已结算' : '未结算'"></span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <p x-show="records.length == 0" class="has-text-grey">暂无当班记录</p>
                </div>
            </div>
        </template>
    </div>
</section>

<script>
function shiftApp() {
    return {
        shift: null,
        records: [],
        summary: null,
        warningStats: !{warning_stats_json},
        shiftWarnings: !{shift_warnings_json},
        init() {
            this.shift = {{!shift_json}};
            this.records = {{!records_json}};
            this.summary = {{!summary_json}};
        },
        async closeShift() {
            if (!confirm('确认完成当前班次交接？将自动开始新班次。')) return;
            const r = await fetch('/api/shift/close', { method: 'POST' });
            const d = await r.json(); alert(d.message);
            if (d.success) { location.reload(); }
        },
        typeText(t) {
            const m = {
                'long_unreturned':'长时间未退',
                'frequent_loss':'频繁遗失',
                'continuous_reissue':'连续补办',
                'frozen_misuse':'冻结误操作',
                'abnormal_discount':'异常优惠',
                'balance_anomaly':'储值异常',
                'topup_anomaly':'充值频次异常',
                'member_upgrade':'会员升级',
                'cross_store_discount_anomaly':'跨店优惠异常'
            };
            return m[t] || t;
        },
        levelText(l) {
            const m = {'high':'高级','medium':'中级','normal':'一般'};
            return m[l] || l;
        },
        formatTime(t) {
            if (!t) return '';
            const d = new Date(t);
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0')
                + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
        }
    };
}
</script>
</body>
</html>
