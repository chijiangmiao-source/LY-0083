<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入场发牌</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js"></script>
    <style>
        .tag-available { background-color: #48c78e !important; }
    </style>
</head>
<body style="background-color: #f5f5f5; min-height: 100vh;" x-data="issueApp()">
<nav class="navbar is-primary" role="navigation">
    <div class="navbar-brand">
        <a class="navbar-item" style="font-weight:700;font-size:1.2rem;" href="/">🛁 澡堂手牌管理系统</a>
    </div>
    <div class="navbar-menu">
        <div class="navbar-start">
            <a class="navbar-item" href="/">首页</a>
            <a class="navbar-item" href="/bath-areas">浴区管理</a>
            <a class="navbar-item" href="/wristbands">手牌配置</a>
            <a class="navbar-item is-active" href="/issue">入场发牌</a>
            <a class="navbar-item" href="/return">退牌结算</a>
            <a class="navbar-item" href="/report-loss">遗失申报</a>
            <a class="navbar-item" href="/reissue-review">补办审核</a>
            <a class="navbar-item" href="/shift-summary">交接汇总</a>
        </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <span class="mr-3">欢迎，{{user['full_name']}}</span>
                <a class="button is-light" href="/logout">退出登录</a>
            </div>
        </div>
    </div>
</nav>
<section class="section">
    <div class="container">
        <h1 class="title">入场发牌</h1>
        <div class="columns">
            <div class="column is-5">
                <div class="box">
                    <h2 class="subtitle">顾客信息</h2>
                    <div class="field">
                        <label class="label">选择浴区</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select x-model="form.bath_area_id" @change="loadBands()">
                                    <option value="">全部浴区</option>
                                    <template x-for="a in areas" :key="a.id">
                                        <option :value="a.id" x-text="a.name + ' (¥' + a.base_price + '/押¥' + a.deposit_amount + ')'"></option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="field">
                        <label class="label">顾客姓名</label>
                        <div class="control"><input class="input" type="text" x-model="form.customer_name" placeholder="请输入顾客姓名"></div>
                    </div>
                    <div class="field">
                        <label class="label">联系电话 <span class="has-text-danger">*</span></label>
                        <div class="control"><input class="input" type="text" x-model="form.phone" @blur="checkPhone()" placeholder="请输入联系电话"></div>
                        <p class="help is-danger" x-show="phoneError" x-text="phoneError"></p>
                    </div>
                    <div class="field">
                        <label class="label">选择手牌</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select x-model="form.wristband_id">
                                    <option value="">请选择可用手牌</option>
                                    <template x-for="b in availableBands" :key="b.id">
                                        <option :value="b.id" x-text="b.wristband_no + ' - ' + (b.bath_area_name || '通用')"></option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="field" x-show="selectedBand">
                        <div class="notification is-info">
                            <p>手牌：<strong x-text="selectedBand.wristband_no"></strong></p>
                            <p>基础费用：¥ <span x-text="selectedBand.base_price"></span></p>
                            <p>押金金额：¥ <span x-text="selectedBand.deposit_amount"></span></p>
                        </div>
                    </div>
                    <div class="field">
                        <div class="control">
                            <button class="button is-primary is-fullwidth is-medium" @click="submit()" :disabled="submitting">
                                <span x-show="!submitting">确认发牌</span>
                                <span x-show="submitting">处理中...</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="column is-7">
                <div class="box">
                    <h2 class="subtitle">可用手牌列表</h2>
                    <div style="overflow-x:auto;">
                        <table class="table is-fullwidth is-striped is-hoverable">
                            <thead>
                                <tr><th>编号</th><th>浴区</th><th>基础费</th><th>押金</th><th>操作</th></tr>
                            </thead>
                            <tbody>
                                <template x-for="b in availableBands" :key="b.id">
                                    <tr :class="{'is-selected': form.wristband_id == b.id}">
                                        <td><strong x-text="b.wristband_no"></strong></td>
                                        <td x-text="b.bath_area_name || '-'"></td>
                                        <td>¥ <span x-text="b.base_price"></span></td>
                                        <td>¥ <span x-text="b.deposit_amount"></span></td>
                                        <td><button class="button is-small is-primary" @click="selectBand(b)">选择</button></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <p x-show="availableBands.length == 0" class="has-text-grey">暂无可用手牌</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="modal" :class="{'is-active': showResult}">
    <div class="modal-background" @click="showResult=false"></div>
    <div class="modal-content">
        <div class="box">
            <h2 class="subtitle has-text-success">发牌成功！</h2>
            <div class="content">
                <p>流水号：<strong x-text="result.serial_no"></strong></p>
                <p>顾客：<span x-text="result.customer_name"></span></p>
                <p>电话：<span x-text="result.phone"></span></p>
                <p>发牌时间：<span x-text="result.issue_time"></span></p>
            </div>
            <button class="button is-primary" @click="showResult=false; resetForm()">继续发牌</button>
        </div>
    </div>
</div>

<script>
function issueApp() {
    return {
        areas: [],
        availableBands: [],
        form: { bath_area_id: '', customer_name: '', phone: '', wristband_id: '' },
        phoneError: '',
        submitting: false,
        showResult: false,
        result: {},
        async init() {
            this.areas = {{!areas_json}};
            await this.loadBands();
        },
        get selectedBand() {
            return this.availableBands.find(b => b.id == this.form.wristband_id);
        },
        selectBand(b) { this.form.wristband_id = b.id; },
        async loadBands() {
            const qs = this.form.bath_area_id ? 'area_id=' + this.form.bath_area_id : '';
            const r = await fetch('/api/issue/available-bands?' + qs); const d = await r.json();
            if (d.success) { this.availableBands = d.data || []; }
        },
        async checkPhone() {
            this.phoneError = '';
            if (!this.form.phone) return;
            const r = await fetch('/api/issue/check-phone?phone=' + encodeURIComponent(this.form.phone));
            const d = await r.json();
            if (!d.data.can_issue) {
                this.phoneError = '该手机号存在未结清遗失记录，无法领牌';
            }
        },
        async submit() {
            if (!this.form.phone) { alert('请输入联系电话'); return; }
            if (!this.form.wristband_id) { alert('请选择手牌'); return; }
            if (this.phoneError) { alert(this.phoneError); return; }
            this.submitting = true;
            try {
                const r = await fetch('/api/issue', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                });
                const d = await r.json(); alert(d.message);
                if (d.success) { this.result = d.data; this.showResult = true; }
            } finally { this.submitting = false; }
        },
        resetForm() { this.form = { bath_area_id: this.form.bath_area_id, customer_name: '', phone: '', wristband_id: '' }; this.loadBands(); }
    };
}
</script>
</body>
</html>
