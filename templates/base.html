<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澡堂手牌管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js"></script>
    <style>
        body { background-color: #f5f5f5; min-height: 100vh; }
        .navbar-brand-title { font-weight: 700; font-size: 1.2rem; }
        .card-table { overflow-x: auto; }
        .tag-available { background-color: #48c78e !important; }
        .tag-issued { background-color: #3298dc !important; }
        .tag-frozen { background-color: #f14668 !important; }
        .tag-replaced { background-color: #7b61ff !important; }
        .tag-pending { background-color: #ffdd57 !important; color: #333; }
        .tag-settled { background-color: #48c78e !important; }
        .tag-unsettled { background-color: #ff9f43 !important; }
        .tag-lost { background-color: #f14668 !important; }
        .tag-normal { background-color: #48c78e !important; }
        .tag-level-high { background-color: #f14668 !important; color: #fff !important; }
        .tag-level-medium { background-color: #ff9f43 !important; color: #fff !important; }
        .tag-level-normal { background-color: #3298dc !important; color: #fff !important; }
        .timeline { position: relative; padding-left: 30px; }
        .timeline::before { content: ''; position: absolute; left: 10px; top: 5px; bottom: 5px; width: 2px; background: #dbdbdb; }
        .timeline-item { position: relative; padding-bottom: 20px; }
        .timeline-item::before { content: ''; position: absolute; left: -24px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: #3298dc; border: 2px solid #fff; box-shadow: 0 0 0 2px #dbdbdb; }
        .timeline-item.is-success::before { background: #48c78e; }
        .timeline-item.is-danger::before { background: #f14668; }
        .timeline-item.is-warning::before { background: #ff9f43; }
        .timeline-item.is-info::before { background: #3298dc; }
        .timeline-item.is-purple::before { background: #7b61ff; }
        .warning-badge { display: inline-block; min-width: 22px; padding: 0 6px; line-height: 22px; text-align: center; border-radius: 11px; background: #f14668; color: #fff; font-size: 12px; font-weight: bold; margin-left: 4px; }
        .warning-card { border-left: 4px solid #f14668 !important; }
        .warning-card.is-medium { border-left-color: #ff9f43 !important; }
        .warning-card.is-normal { border-left-color: #3298dc !important; }
        .scroll-warning-list { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
% if user:
<nav class="navbar is-primary" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
        <a class="navbar-item navbar-brand-title" href="/">🛁 澡堂手牌管理系统</a>
        <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false">
            <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
        </a>
    </div>
    <div class="navbar-menu">
        <div class="navbar-start">
            <a class="navbar-item" href="/">首页</a>
            <a class="navbar-item" href="/bath-areas">浴区管理</a>
            <a class="navbar-item" href="/wristbands">手牌配置</a>
            <a class="navbar-item" href="/issue">入场发牌</a>
            <a class="navbar-item" href="/return">退牌结算</a>
            <a class="navbar-item" href="/report-loss">遗失申报</a>
            <a class="navbar-item" href="/reissue-review">补办审核</a>
            <a class="navbar-item" href="/wristband-tracking">手牌追踪</a>
            <a class="navbar-item" href="/warnings">预警中心</a>
            <a class="navbar-item" href="/shift-summary">交接汇总</a>
        </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <span class="mr-3">欢迎，{{user['full_name']}}</span>
                <a class="button is-light" href="/logout">退出登录</a>
            </div>
        </div>
    </div>
</nav>
% end
<section class="section">
    <div class="container">
        {{!base}}
    </div>
</section>
</body>
</html>
